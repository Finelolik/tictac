<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все игры — Крестики-нолики</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #6366f1;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #f43f5e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: var(--text-muted); margin-bottom: 24px; }
        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 24px;
            min-width: 140px;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .refresh-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        .refresh-btn:hover { background: var(--surface-hover); }
        .games-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .games-table th,
        .games-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .games-table th {
            background: rgba(99, 102, 241, 0.1);
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .games-table tr:last-child td { border-bottom: none; }
        .games-table tr:hover td { background: var(--surface-hover); }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-pvp { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .badge-pve { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-ended { background: rgba(244, 63, 94, 0.2); color: #fb7185; }
        .badge-draw { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .game-id {
            font-family: monospace;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-icon { font-size: 3rem; margin-bottom: 12px; }
        .winner-x { color: var(--danger); font-weight: 700; }
        .winner-o { color: #3b82f6; font-weight: 700; }
        @media (max-width: 600px) {
            .games-table th, .games-table td { padding: 10px 12px; font-size: 0.85rem; }
            .game-id { font-size: 0.8rem; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <h1>📊 Все игры</h1>
        <p class="subtitle">Мониторинг активных и завершённых сессий</p>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Всего игр</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statActive">0</div>
                <div class="stat-label">Активных</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statPvp">0</div>
                <div class="stat-label">PvP</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statPve">0</div>
                <div class="stat-label">PvE</div>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadGames()">🔄 Обновить</button>

        <div id="content">
            <div class="empty">
                <div class="empty-icon">⏳</div>
                <div>Загрузка...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadGames() {
            try {
                const res = await fetch('/games');
                const data = await res.json();
                render(data.games || []);
            } catch (e) {
                document.getElementById('content').innerHTML =
                    '<div class="empty"><div class="empty-icon">⚠️</div><div>Ошибка загрузки</div></div>';
            }
        }

        function render(games) {
            const total = games.length;
            const active = games.filter(g => !g.game_over).length;
            const pvp = games.filter(g => g.mode === 'pvp').length;
            const pve = games.filter(g => g.mode === 'pve').length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statActive').textContent = active;
            document.getElementById('statPvp').textContent = pvp;
            document.getElementById('statPve').textContent = pve;

            if (!games.length) {
                document.getElementById('content').innerHTML =
                    '<div class="empty"><div class="empty-icon">🎮</div><div>Нет активных игр</div></div>';
                return;
            }

            const rows = games.map(g => {
                const modeClass = g.mode === 'pvp' ? 'badge-pvp' : 'badge-pve';
                const modeText = g.mode === 'pvp' ? 'PvP' : 'PvE';
                let statusClass, statusText;
                if (g.game_over) {
                    if (g.winner === 'draw') {
                        statusClass = 'badge-draw';
                        statusText = 'Ничья';
                    } else {
                        statusClass = 'badge-ended';
                        statusText = g.winner + ' победил';
                    }
                } else {
                    statusClass = 'badge-active';
                    statusText = 'Идёт игра';
                }
                const winnerClass = g.winner === 'X' ? 'winner-x' : g.winner === 'O' ? 'winner-o' : '';
                return `<tr>
                    <td><span class="game-id">${g.game_id}</span></td>
                    <td><span class="badge ${modeClass}">${modeText}</span></td>
                    <td>${g.mode === 'pvp' ? g.players + '/2' : '—'}</td>
                    <td>${g.current_player}</td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                    <td class="${winnerClass}">${g.winner || '—'}</td>
                </tr>`;
            }).join('');

            document.getElementById('content').innerHTML = `
                <table class="games-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Режим</th>
                            <th>Игроки</th>
                            <th>Ход</th>
                            <th>Статус</th>
                            <th>Победитель</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        loadGames();
        setInterval(loadGames, 3000);
    </script>
</body>
</html>
