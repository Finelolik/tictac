<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<base target="_blank">
</head>
<body>
    <div class="wrapper">
        <button class="back-btn hidden" id="backBtn" onclick="goBack()">← Назад</button>
        <div class="container">
            <h1>⭕ Крестики-нолики</h1>
            <p class="subtitle">Играй с друзьями или с ботом</p>

            <!-- Меню -->
            <div id="menu" class="menu">
                <button class="btn btn-primary" onclick="createGame('pve')">
                    🤖 Играть с ботом
                </button>
                <div class="divider">или</div>
                <button class="btn btn-primary" onclick="createGame('pvp')">
                    👥 Создать комнату
                </button>
                <div class="divider">присоединиться</div>
                <div class="input-group">
                    <input type="text" id="joinCode" class="input" placeholder="Код комнаты" maxlength="8">
                    <button class="btn btn-secondary" onclick="joinGame()" style="width:auto; padding: 14px 20px;">
                        Войти
                    </button>
                </div>
            </div>

            <!-- Экран ожидания PvP -->
            <div id="lobby" class="game-screen hidden">
                <div class="room-code">
                    <div class="room-code-label">Код комнаты</div>
                    <div class="room-code-value" id="lobbyCode">--------</div>
                </div>
                <div class="players-count" id="lobbyStatus">
                    <span class="spinner"></span> Ожидание второго игрока...
                </div>
                <button class="btn btn-danger" onclick="leaveGame()">Покинуть комнату</button>
            </div>

            <!-- Игровой экран -->
            <div id="game" class="game-screen hidden">
                <div class="status-bar">
                    <span id="gameMode">Режим</span>
                    <span class="status-badge" id="gameStatus">Активно</span>
                </div>
                <div class="turn-indicator" id="turnIndicator">Ходит X</div>
                <div id="message" class="message hidden"></div>
                <div class="board" id="board">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>
                    <div class="cell" data-index="2"></div>
                    <div class="cell" data-index="3"></div>
                    <div class="cell" data-index="4"></div>
                    <div class="cell" data-index="5"></div>
                    <div class="cell" data-index="6"></div>
                    <div class="cell" data-index="7"></div>
                    <div class="cell" data-index="8"></div>
                </div>
                <div class="players-count" id="playersInfo"></div>
                <button class="btn btn-secondary" onclick="resetGame()">🔄 Новая игра</button>
                <button class="btn btn-danger" onclick="leaveGame()">🏠 Выйти в меню</button>
            </div>
        </div>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
