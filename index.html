<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Крестики-нолики</title>
  <style>
    :root { --bg: #1a1a1a; --panel: #2a2a2a; --text: #e0e0e0; --accent: #4a90e2; --x: #5050c8; --o: #c83232; --line: #555; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 400px; padding: 20px; text-align: center; }
    h1 { margin-bottom: 20px; }
    .section { background: var(--panel); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
    .btn { padding: 12px 20px; margin: 5px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sec { background: var(--line); }
    input { padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); text-align: center; width: 120px; margin: 5px; }
    #status { margin: 10px 0; font-weight: bold; min-height: 24px; }
    #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--line); padding: 4px; border-radius: 8px; margin: 15px auto; max-width: 300px; aspect-ratio: 1; }
    .cell { background: var(--panel); border: none; font-size: 48px; cursor: pointer; color: var(--text); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    .cell:hover:not(:disabled) { background: #333; }
    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell:disabled { cursor: default; }
    .hidden { display: none !important; }
    .room-id { font-family: monospace; font-size: 24px; background: var(--bg); padding: 10px; border-radius: 8px; margin: 10px 0; letter-spacing: 2px; }
    .conn-status { font-size: 12px; margin-bottom: 10px; color: #888; }
    .conn-status.ok { color: #4f4; }
    .conn-status.err { color: #f44; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Крестики-нолики</h1>
    <div id="conn" class="conn-status">🔌 Отключено</div>

    <div id="menu" class="section">
      <button class="btn" onclick="start('pvp')">👥 Игрок vs Игрок</button>
      <button class="btn" onclick="start('pve')">🤖 Игрок vs Робот</button>
      <div style="margin-top:15px; border-top:1px solid var(--line); padding-top:15px;">
        <input type="text" id="rid" placeholder="ID комнаты" maxlength="8">
        <button class="btn btn-sec" onclick="join()">Войти</button>
      </div>
    </div>

    <div id="wait" class="section hidden">
      <h2>Ожидание соперника</h2>
      <p>Отправьте код другу:</p>
      <div class="room-id" id="display-id">----</div>
      <button class="btn btn-sec" onclick="copyId()">📋 Копировать</button>
      <button class="btn btn-sec" onclick="toMenu()">Отмена</button>
    </div>

    <div id="game" class="section hidden">
      <div id="status">Ход: X</div>
      <div id="board"></div>
      <button class="btn" id="reset-btn" onclick="doReset()" disabled>🔄 Рестарт</button>
      <button class="btn btn-sec" onclick="toMenu()">В меню</button>
    </div>
  </div>

  <script>
    const API = "https://studvpn.alwaysdata.net";
    let ws = null, gid = null, mode = null, myPlayer = null;

    const $ = id => document.getElementById(id);
    const show = id => $(id).classList.remove('hidden');
    const hide = id => $(id).classList.add('hidden');
    const setConn = (ok, msg) => { $('conn').className = 'conn-status ' + (ok ? 'ok' : 'err'); $('conn').textContent = msg || (ok ? '✅ Подключено' : '🔌 Отключено'); };

    function start(m) {
      mode = m;
      fetch(`${API}/game/create`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({mode: m}) })
        .then(r => r.json()).then(d => {
          gid = d.game_id.toUpperCase();
          if (m === 'pve') {
            // Для PvE сразу показываем игру, ID не выводим
            show('game'); hide('menu');
            renderBoard(d);
            setConn(true, '🤖 PvE режим');
          } else {
            // Для PvP показываем комнату ожидания
            show('wait'); hide('menu');
            $('display-id').textContent = gid;
            connectWS(gid);
          }
        });
    }

    function join() {
      const id = $('rid').value.trim().toUpperCase();
      if (!id) return alert('Введите ID');
      fetch(`${API}/game/${id}`).then(r => {
        if (!r.ok) throw new Error('Игра не найдена');
        return r.json();
      }).then(d => {
        if (d.mode !== 'pvp') return alert('Эта игра не для PvP');
        gid = id; mode = 'pvp';
        connectWS(gid);
        hide('menu');
      }).catch(e => alert(e.message));
    }

    function connectWS(id) {
      ws = new WebSocket(`ws://studvpn.alwaysdata.net/ws/${id}`);
      ws.onopen = () => setConn(true, '✅ Ожидание игрока...');
      ws.onmessage = e => {
        const d = JSON.parse(e.data);
        if (d.error) { alert(d.error); toMenu(); return; }
        if (d.type === 'joined') {
          myPlayer = d.player;
          if (d.state.players >= 2) {
            hide('wait'); show('game');
            setConn(true, `👥 Вы игрок ${myPlayer} (${myPlayer===1?'X':'O'})`);
          } else {
            $('conn').textContent = `👤 Вы игрок ${myPlayer}. Ждем второго...`;
          }
        }
        if (d.type === 'update') {
          if (d.players >= 2) { hide('wait'); show('game'); setConn(true, `👥 Игроков: ${d.players}`); }
          renderBoard(d.state);
        }
      };
      ws.onclose = () => { setConn(false, ' Отключено'); $('reset-btn').disabled = true; };
    }

    function renderBoard(s) {
      $('status').textContent = s.game_over ? s.message : `Ход: ${s.current_player}`;
      $('reset-btn').disabled = !s.game_over;
      const b = $('board'); b.innerHTML = '';
      s.board.forEach((v, i) => {
        const c = document.createElement('button');
        c.className = `cell ${v ? v.toLowerCase() : ''}`;
        c.textContent = v || '';
        // Определяем чей ход
        const isMyTurn = mode === 'pve' ? s.current_player === 'X' : (s.current_player === (myPlayer===1?'X':'O'));
        c.disabled = v || s.game_over || !isMyTurn || (mode==='pvp' && (!ws || ws.readyState!==1));
        if (!c.disabled) c.onclick = () => makeMove(i);
        b.appendChild(c);
      });
    }

    function makeMove(pos) {
      if (mode === 'pve') {
        fetch(`${API}/game/${gid}/move`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({position: pos}) })
          .then(r => r.json()).then(renderBoard);
      } else if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({type: 'move', position: pos}));
      }
    }

    function doReset() {
      if (mode === 'pve') {
        fetch(`${API}/game/${gid}/reset`, {method: 'POST'}).then(r => r.json()).then(renderBoard);
      } else if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({type: 'reset'}));
      }
    }

    function copyId() {
      navigator.clipboard.writeText(gid).then(() => {
        const b = document.querySelector('#wait button');
        const t = b.textContent; b.textContent = '✅ Скопировано!';
        setTimeout(() => b.textContent = t, 1500);
      });
    }

    function toMenu() {
      if (ws) ws.close();
      ws = null; gid = null; mode = null; myPlayer = null;
      hide('wait'); hide('game'); show('menu');
      setConn(false, '🔌 Отключено');
      $('rid').value = '';
    }
  </script>
</body>
</html>
